name: PrizePicks Snapshot

on:
  workflow_dispatch:

jobs:
  run-prizepicks:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run PrizePicks scraper
        run: node src/scrapers/prizepicks.js

      - name: Commit output files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/prizepicks-latest.json data/prizepicks-raw-latest.json
          git commit -m "Update PrizePicks snapshot" || echo "No changes to commit"
          git push
